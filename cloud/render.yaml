# Render.com Blueprint — 이 저장소를 Render 에 연결하면 아래 설정으로 자동 배포된다.
services:
  - type: web
    name: berthmonitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: BERTH_REFRESH_SEC
        value: "600"
      - key: PYTHON_VERSION
        value: "3.12.0"
