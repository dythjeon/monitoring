<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #f4f5f8; --card: #ffffff; --border: #edeef2; --text: #0b0f19; --muted: #8a8f98;
  --primary: #2f6fed; --primary-dark: #1d4fc4; --primary-soft: #eaf1fe;
  --track: #e4e8f0; --row-alt: #eff1f6; --grid-major: #ccd2dc; --grid-minor: #edf0f5;
  --now: #ef4444; --sat: #2f6fed; --sun: #e8474c; --hover-row: #eef4ff; --table-line: #dfe3ea;
  --busan: #2f6fed; --incheon: #f5a524; --gwangyang: #12b886; --japan: #e64980; --china: #7048e8;
  --shadow: 0 1px 2px rgba(11,15,25,.04), 0 8px 24px -12px rgba(195,200,212,.9);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-y: scroll; scrollbar-gutter: stable; }   /* 탭마다 스크롤바가 생겼다 없어져 화면이 좌우로 흔들리는 것 방지 */
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ---- 헤더 ---- */
header { background: var(--card); border-bottom: 1px solid var(--border); }
.hd { max-width: 1480px; margin: 0 auto; padding: 18px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.hd h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.hd .logo { height: 44px; width: auto; flex: none; }
.hd .sub { margin-top: 5px; color: var(--muted); font-size: 12.5px; }
.hd .right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); position: relative; cursor: default; }
.status.err { color: var(--now); }
.live { width: 8px; height: 8px; border-radius: 50%; background: #c9ced8; flex: none; transition: background .3s; }
.live.on { background: #12b886; box-shadow: 0 0 0 3px rgba(18,184,134,.18); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; display: none; flex: none; }
.spin.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.popover { position: absolute; top: 24px; right: 0; background: #1c1f26; color: #f1f3f7; padding: 10px 13px; border-radius: 10px; font-size: 12px; white-space: pre; line-height: 1.6; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 30; display: none; }
.status:hover .popover { display: block; }
.btn { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 9px 20px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: background .15s; }
.btn:hover { background: var(--primary-dark); }
.btn:disabled { opacity: .6; cursor: default; }
.chip { font-size: 11.5px; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 3px 10px; }

/* ---- 통계 카드 ---- */
main { flex: 1; display: flex; flex-direction: column; max-width: 1480px; width: 100%; margin: 0 auto; padding: 24px 28px 18px; gap: 18px; }
.stats { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.stats .sep { width: 1px; background: var(--border); margin: 10px 8px; align-self: stretch; }
.stat { flex: 1 1 120px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow); min-width: 120px; }
.stat .lb { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .dot { width: 8px; height: 8px; border-radius: 50%; }
.stat .v { font-size: 26px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; line-height: 1.1; }
.stat.em { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 10px 24px -10px rgba(47,111,237,.6); }
.stat.em .lb { color: rgba(255,255,255,.8); }

/* ---- 탭 ---- */
.tabs { display: inline-flex; background: #e9ebf1; border-radius: 999px; padding: 4px; gap: 2px; align-self: flex-start; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(11,15,25,.12); }

/* ---- 콘텐츠 카드 ---- */
.card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; min-height: 420px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.pane { flex: 1; display: none; min-height: 0; overflow: auto; }
.pane.on { display: flex; flex-direction: column; }
.pane svg { display: block; font-family: inherit; }
.empty-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; pointer-events: none; }

/* 툴팁 */
.tip { position: fixed; z-index: 50; background: #1c1f26; color: #f1f3f7; padding: 9px 12px; border-radius: 10px; font-size: 12px; line-height: 1.55; white-space: pre; pointer-events: none; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 360px; }
.tip b { font-size: 13px; }

/* ---- 본선작업현황 ---- */
.work { padding: 6px 8px; }
.work .axis { display: grid; grid-template-columns: 170px 1fr 56px; margin-bottom: 8px; }
.work .axis .ticks { position: relative; height: 18px; color: var(--muted); font-size: 11px; }
.work .axis .ticks span { position: absolute; transform: translateX(-50%); }
.work .row { display: grid; grid-template-columns: 170px 1fr 56px; align-items: center; height: 54px; border-radius: 10px; padding: 0 4px; }
.work .row:nth-child(even) { background: var(--row-alt); }
.work .row .lb { font-weight: 700; font-size: 13px; padding-left: 10px; }
.work .track { position: relative; height: 30px; background: var(--track); border-radius: 6px; overflow: hidden; background-image: linear-gradient(90deg, var(--grid-major) 1px, transparent 1px); background-size: 25% 100%; background-position: -1px 0; }
.work .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; border: 1.2px solid #fff; }
.work .txt { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; line-height: 1.15; }
.work .txt .n { font-weight: 700; font-size: 12.5px; }
.work .txt .vy { font-size: 11px; opacity: .8; }
.work .pct { text-align: right; font-weight: 700; font-size: 14px; padding-right: 6px; }

/* ---- 국내공컨현황 ---- */
.emp { padding: 6px 10px 10px; }
.emp .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; padding: 0 12px; }
.emp .head h2 { margin: 0; font-size: 16px; }
.emp .head .m { color: var(--muted); font-size: 12px; }
.emp .head .tot { margin-left: auto; display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 12px; }
.emp .head .tot b { color: var(--primary); font-size: 22px; }
table.et { width: 100%; border-collapse: collapse; }
table.et th, table.et td { padding: 10px 12px; text-align: center; white-space: nowrap; }
table.et th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.et th.g { text-align: center; padding: 8px 0 6px; background: #f3f5f9; border: 1px solid var(--table-line); border-bottom: 0; border-radius: 12px 12px 0 0; }
table.et th.g span { display: inline-block; background: var(--primary-soft); color: var(--primary-dark); border-radius: 8px; padding: 3px 14px; font-size: 11.5px; font-weight: 700; }
/* DC/OT/FR 그룹은 셀마다 배경을 깔고 양끝 셀에 세로 테두리를 줘서 하나의 블록으로 보이게 한다 */
table.et .gc { background: #f6f7fa; }
table.et .gl { border-left: 1px solid var(--table-line); }
table.et .gr { border-right: 1px solid var(--table-line); }
table.et tbody tr:hover .gc { background: #e6eefc; }
table.et tfoot td.gc { background: #eef0f5; }
table.et tfoot td.gl { border-bottom-left-radius: 12px; border-bottom: 1px solid var(--table-line); }
table.et tfoot td.gr { border-bottom-right-radius: 12px; border-bottom: 1px solid var(--table-line); }
table.et tfoot td.gc { border-bottom: 1px solid var(--table-line); }
table.et thead tr:last-child th.gc { border-bottom: 1px solid var(--table-line); }
table.et td.lb, table.et th.lb { text-align: left; }
.emp .note { color: var(--muted); font-size: 11.5px; padding: 10px 12px 0; }
table.et th.gap, table.et td.gap { width: 22px; padding: 0; background: transparent !important; }
table.et thead tr:last-child th { border-bottom: 1px solid var(--table-line); }
table.et tbody tr { border-bottom: 1px solid var(--border); }
table.et tbody tr:hover { background: var(--hover-row); }
table.et td { font-size: 13.5px; }
table.et td.lb { font-weight: 700; font-size: 13.5px; }
table.et td.lb .rg { color: var(--muted); font-weight: 400; font-size: 10.5px; margin-left: 8px; }
table.et td.lb .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 9px; vertical-align: 1px; }
table.et td.zero { color: #c9ced8; }
table.et td.tot { font-weight: 700; font-size: 15px; }
table.et tfoot td { font-weight: 700; border-top: 1px solid var(--table-line); padding-top: 12px; padding-bottom: 12px; }
table.et tfoot td.tot { color: var(--primary); font-size: 16px; }
.share { padding: 22px 12px 0; }
.share .lb { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.share .bar { display: flex; height: 14px; gap: 3px; border-radius: 4px; overflow: hidden; }
.share .bar i { display: block; border-radius: 4px; min-width: 0; }
.share .lg { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: 12px; }
.share .lg span.c { color: var(--muted); margin-left: 7px; }
.share .lg i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* ---- 태풍 모니터링 ---- */
.ty { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; padding: 2px; align-items: start; }
.ty-map { position: relative; background: #d9e6f2; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); min-height: 360px; }
.ty-map svg { display: block; width: 100%; }
.ty-map .legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; background: rgba(255,255,255,.88); border-radius: 10px; padding: 7px 10px; font-size: 11px; color: var(--text); backdrop-filter: blur(4px); max-width: calc(100% - 20px); }
.ty-map .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.ty-map .legend .fc { width: 14px; height: 0; border-top: 2px dashed #555; border-radius: 0; vertical-align: 3px; }
.ty-map .stamp { position: absolute; right: 10px; top: 10px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.85); border-radius: 8px; padding: 4px 8px; }
.ty-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-height: var(--mapH, none); overflow: auto; padding-right: 2px; }
.ty-side h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.ty-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 10px 4px 6px; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.ty-toggle i { width: 22px; height: 12px; border-radius: 999px; background: var(--track); position: relative; transition: background .15s; }
.ty-toggle i::after { content: ""; position: absolute; left: 1px; top: 1px; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.ty-toggle.on { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.ty-toggle.on i { background: var(--primary); }
.ty-toggle.on i::after { transform: translateX(10px); }
.ty-side .m { color: var(--muted); font-size: 11.5px; }
.ty-quiet { background: var(--bg); border-radius: 14px; padding: 18px 16px; text-align: center; }
.ty-quiet .big { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.ty-storm { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); background: var(--card); }
.ty-storm.dim { opacity: .72; }
.ty-storm .nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ty-storm .nm b { font-size: 15px; }
.ty-storm .nm .en { color: var(--muted); font-size: 12px; font-weight: 500; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; color: #fff; }
.pill.ghost { background: var(--bg); color: var(--muted); }
.ty-storm .kv { display: grid; grid-template-columns: 64px 1fr; gap: 3px 10px; margin-top: 9px; font-size: 12.5px; }
.ty-storm .kv span:nth-child(odd) { color: var(--muted); }
.ty-storm .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.lnk { display: inline-block; border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 11.5px; color: var(--primary-dark); text-decoration: none; background: var(--card); }
.lnk:hover { background: var(--primary-soft); }
.ty-src { border-top: 1px solid var(--border); padding-top: 10px; }
.ty-src .lb { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.ty-src .row { display: flex; flex-wrap: wrap; gap: 6px; }
.ty-err { font-size: 11px; color: var(--now); white-space: pre-wrap; }
@media (max-width: 980px) { .ty { grid-template-columns: 1fr; } .ty-side { max-height: none; } }

footer { text-align: center; color: #b4b8c2; font-size: 11px; padding: 0 0 14px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1c1f26; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
.toast.on { opacity: 1; }
/* ---- 비밀번호 잠금 화면 ---- */
.gate { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
.gate.on { display: flex; }
.gate form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 30px 26px 26px; text-align: center; }
.gate img { height: 48px; margin-bottom: 12px; }
.gate h2 { margin: 0 0 4px; font-size: 18px; }
.gate p { margin: 0 0 18px; color: var(--muted); font-size: 12.5px; }
.gate input { width: 100%; border: 1px solid var(--table-line); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 14px; outline: none; text-align: center; }
.gate input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.gate .btn { width: 100%; margin-top: 10px; padding: 11px; }
.gate .msg { min-height: 18px; margin-top: 10px; font-size: 12px; color: var(--now); }

@media (max-width: 760px) {
  .hd { padding: 14px 16px; } .hd h1 { font-size: 18px; } .hd .logo { height: 34px; } .hd .right { margin-left: 0; width: 100%; flex-direction: row; justify-content: space-between; align-items: center; }
  main { padding: 14px 16px; gap: 12px; }
  .stats .sep { display: none; } .stat { padding: 10px 14px; } .stat .v { font-size: 22px; }
  .card { padding: 10px; min-height: 360px; }
  .work .axis, .work .row { grid-template-columns: 110px 1fr 48px; }
}
</style>

<script>
// ===================== 상수 (gui.py 와 동일) =====================
const WINDOW_DAYS = 7;
const MIN_ROWS = 5;
const TERMINAL_ORDER = ["신선대", "감만", "허치슨", "광양서부", "E1CT", "한진신항", "선광신항"];
const TERMINAL_REGION = { "신선대": "부산", "감만": "부산", "허치슨": "부산", "광양서부": "광양",
                          "E1CT": "인천", "한진신항": "인천", "선광신항": "인천" };
const REGION_COLOR = { "부산": "#2f6fed", "인천": "#f5a524", "광양": "#12b886" };
const COUNTRY_KEYS = ["일본", "중국"];
const COUNTRY_COLOR = { "일본": "#e64980", "중국": "#7048e8", "동남아": "#00b8d4", "러시아": "#12b886" };
const TAB_KEYS = ["전체", "부산", "인천", "광양"];
const TABS = [["전체", "전체"], ["부산", "부산항"], ["인천", "인천항"], ["광양", "광양항"],
              ["work", "본선작업현황"], ["empty", "국내공컨현황"], ["typhoon", "태풍 모니터링"]];
const EMPTY_GROUPS = [["DC", [["GP20", "20'"], ["GP40", "40'"], ["HQ40", "4H"]]],
                      ["OT", [["OT20", "20'"], ["OT40", "40'"]]],
                      ["FR", [["FL20", "20'"], ["FL40", "40'"]]],
                      ["RF", [["RF20", "20'"], ["RH40", "4H"]]]];   // RF 는 광양서부만 제공. 냉동은 40' 일반이 없고 40'HC 뿐
const EMPTY_TERMINALS = ["신선대", "감만", "광양서부", "E1CT", "한진신항"];
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const C = {
  text: "#0b0f19", muted: "#8a8f98", card: "#ffffff", primary: "#2f6fed", rowAlt: "#eff1f6",
  gridMajor: "#ccd2dc", gridMinor: "#edf0f5", now: "#ef4444", sat: "#2f6fed", sun: "#e8474c",
  tableLine: "#dfe3ea", border: "#edeef2", track: "#e4e8f0",
};

// ===================== 상태 =====================
let S = { data: [], work: [], empty: [], errors: [], stats: [], updated_at: null, generation: -1,
          fetching: false, refresh_sec: 600 };
let tab = new URLSearchParams(location.search).get("tab") || localStorage.getItem("bm.tab") || "전체";   // ?tab=work 처럼 링크로 탭 지정 가능
if (!TABS.some(t => t[0] === tab)) tab = "전체";

// ===================== 유틸 =====================
const $ = (id) => document.getElementById(id);
function parseDT(s) {               // "YYYY-MM-DDTHH:MM:SS" 를 로컬 시각으로 (타임존 해석 없이)
  if (!s) return null;
  const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d))?/.exec(s);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null;
}
const pad2 = (n) => String(n).padStart(2, "0");
const fmtDT = (d) => `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const fmtDay = (d) => `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`;
const fmtN = (n) => n.toLocaleString("ko-KR");
function ganttWindow() {
  const s = new Date(); s.setHours(0, 0, 0, 0);
  return [s, new Date(s.getTime() + WINDOW_DAYS * 864e5)];
}
const inWindow = (d, ws, we) => d.eta && d.etd && d.etd >= ws && d.eta <= we;
function blend(a, b, t) {
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
const _mc = document.createElement("canvas").getContext("2d");
function textW(s, px, weight) { _mc.font = `${weight || 400} ${px}px Pretendard, "Segoe UI", "Malgun Gothic", sans-serif`; return _mc.measureText(s).width; }
function fitText(s, px, weight, maxW) {       // 넘치면 말줄임, 2글자도 못 넣으면 빈 문자열
  if (textW(s, px, weight) <= maxW) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (textW(s.slice(0, mid) + "…", px, weight) <= maxW) lo = mid; else hi = mid - 1; }
  return lo >= 2 ? s.slice(0, lo) + "…" : "";
}
const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

// 툴팁
const tip = $("tip");
function showTip(html, ev) { tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 16;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function bindTip(node, html) {
  node.addEventListener("mouseenter", (e) => showTip(html, e));
  node.addEventListener("mousemove", moveTip);
  node.addEventListener("mouseleave", hideTip);
}
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ===================== 헤더/통계/탭 =====================
function buildTabs() {
  const box = $("tabs"); box.innerHTML = "";
  for (const [key, label] of TABS) {
    const b = document.createElement("button");
    b.className = "tab" + (key === tab ? " on" : ""); b.textContent = label; b.dataset.key = key;
    b.onclick = () => { tab = key; localStorage.setItem("bm.tab", key); buildTabs(); renderPane(); };
    box.appendChild(b);
  }
}

function renderStats(visible) {
  const groups = [
    [["__total__", "전체", C.primary, true]],
    TAB_KEYS.slice(1).map(k => [k, k + "항", REGION_COLOR[k], false]),
  ];
  const count = (key) => key === "__total__" ? visible.length
    : TAB_KEYS.includes(key) ? visible.filter(d => d.region === key).length
    : visible.filter(d => d.country === key).length;
  const box = $("stats"); box.innerHTML = "";
  groups.forEach((g, gi) => {
    if (gi) { const s = document.createElement("div"); s.className = "sep"; box.appendChild(s); }
    for (const [key, label, color, em] of g) {
      const d = document.createElement("div");
      d.className = "stat" + (em ? " em" : "");
      d.innerHTML = `<div class="lb"><span class="dot" style="background:${em ? "#fff" : color}"></span>${label}</div><div class="v">${fmtN(count(key))}</div>`;
      box.appendChild(d);
    }
  });
}

function sourceReport() {
  const lines = [];
  for (const [name, cnt] of S.stats || []) {
    lines.push(cnt == null ? `${name}  ·  조회 실패` : cnt === 0 ? `${name}  ·  0건 (해당 선박 없음)` : `${name}  ·  ${cnt}건`);
  }
  if (S.errors && S.errors.length) { if (lines.length) lines.push(""); lines.push(...S.errors); }
  return lines.join("\n");
}

function renderStatus() {
  let msg = S.updated_at ? `마지막 갱신 ${S.updated_at}` : "불러오는 중...";
  if (S.stats && S.stats.length) {
    const ok = S.stats.filter(s => s[1] != null).length;
    msg += `  ·  조회 ${ok}/${S.stats.length}`;
  }
  if (S.errors && S.errors.length) msg += `  ·  오류 ${S.errors.length}건`;
  $("statusText").textContent = msg;
  $("status").classList.toggle("err", !!(S.errors && S.errors.length));
  const rep = sourceReport();
  $("statusDetail").textContent = rep; $("statusDetail").style.display = rep ? "" : "none";
  $("spin").classList.toggle("on", !!S.fetching);
  $("refreshBtn").disabled = !!S.fetching;
  $("subtitle").textContent = `부산항 · 인천항 · 광양항 실시간 선석 배정 현황 · 선사코드 DYS · ${WINDOW_DAYS}일 구간 · ${Math.round(S.refresh_sec / 60)}분마다 자동 갱신`;
  renderNextChip();
}
function renderNextChip() {
  const chip = $("nextChip");
  if (S.fetching) { chip.textContent = "터미널 조회 중"; return; }
  if (!S.updated_at) { chip.textContent = ""; return; }
  const next = parseDT(S.updated_at.replace(" ", "T")).getTime() + S.refresh_sec * 1000;
  const left = Math.max(0, Math.round((next - Date.now()) / 60000));
  chip.textContent = left <= 0 ? "곧 자동 갱신" : `다음 갱신 ${left}분 후`;
}

// ===================== 간트 =====================
function renderGantt(pane, key) {
  pane.innerHTML = "";
  const now = new Date();
  const [ws, we] = ganttWindow();
  const data = key === "전체" ? S.data : S.data.filter(d => d.region === key);
  const usable = data.filter(d => inWindow(d, ws, we));

  // ---- 행 구성: TERMINAL_ORDER 를 그대로 깔고, 접안 없는 터미널은 빈 행으로 자리만 지킨다
  const present = {};
  for (const d of usable) (present[d.terminal] ||= new Set()).add(d.berth);
  const extra = [...new Set(usable.map(d => d.terminal))].filter(t => !TERMINAL_ORDER.includes(t)).sort();
  const rows = [];
  for (const term of [...TERMINAL_ORDER, ...extra]) {
    const region = TERMINAL_REGION[term] || (usable.find(d => d.terminal === term) || {}).region || "";
    if (key !== "전체" && region !== key) continue;
    const berths = present[term] ? [...present[term]].sort((a, b) => String(a).localeCompare(String(b), "ko", { numeric: true })) : [];
    if (berths.length) berths.forEach(b => rows.push({ region, term, berth: b }));
    else rows.push({ region, term, berth: null });
  }

  // ---- 같은 선석에 겹치는 선박은 서브레인으로 세로 분할 (interval partitioning)
  const laneOf = new Map(), laneCount = new Map(), rowTop = new Map();
  let cursor = 0;
  for (const r of rows) {
    const k = r.term + "\u0000" + r.berth;
    const items = usable.filter(d => d.terminal === r.term && d.berth === r.berth).sort((a, b) => a.eta - b.eta || a.etd - b.etd);
    const laneEnd = [];
    for (const d of items) {
      let j = laneEnd.findIndex(end => d.eta >= end);
      if (j < 0) { j = laneEnd.length; laneEnd.push(d.etd); } else laneEnd[j] = d.etd;
      laneOf.set(d, j);
    }
    laneCount.set(k, Math.max(laneEnd.length, 1));
    rowTop.set(k, cursor); cursor += laneCount.get(k);
  }
  const totalUnits = cursor;

  // ---- 치수
  const W = Math.max(pane.clientWidth, 860);
  const H = Math.max(pane.clientHeight, 360);
  const P = 12, G = 13, HOUR_ROW = 18, DATE_ROW = 34;
  const berthLabel = (b) => b == null ? "—" : `${b}선석`;
  // 탭을 바꿔도 표가 좌우로 움직이지 않게, 열 폭은 전체 자료(모든 터미널·선석) 기준으로 고정
  const allTerms = [...new Set([...TERMINAL_ORDER, ...S.data.map(d => d.terminal)])];
  const allBerths = [...new Set(S.data.filter(d => inWindow(d, ws, we)).map(d => d.berth))];
  const termW = Math.max(0, ...allTerms.map(t => textW(t, 14, 700)));
  const berthW = Math.max(textW("—", 13.5, 400), ...allBerths.map(b => textW(berthLabel(b), 13.5, 400)));
  const sep1 = P + termW + G / 2, sep2 = sep1 + G / 2 + berthW + G / 2;
  const left = sep2 + G, right = W - 14;
  // 구간 밖 다음 입항 안내 줄
  const shown = new Set(usable.map(d => d.terminal));
  const upcoming = {};
  for (const d of data) {
    if (shown.has(d.terminal) || !d.eta || d.eta <= we) continue;
    if (!upcoming[d.terminal] || d.eta < upcoming[d.terminal].eta) upcoming[d.terminal] = d;
  }
  const picks = Object.values(upcoming).sort((a, b) => a.eta - b.eta);
  const FOOT = picks.length ? 22 : 0;
  const top = HOUR_ROW + 6, bottom = H - DATE_ROW - FOOT;
  const units = Math.max(totalUnits, MIN_ROWS);
  const unitH = Math.max(34, Math.min(80, (bottom - top) / units));
  const slack = Math.max(MIN_ROWS - totalUnits, 0) / 2 * unitH;
  const y0 = top + slack;                              // 첫 행 위쪽
  const chartBottom = y0 + totalUnits * unitH;
  const svgH = Math.max(H, chartBottom + slack + DATE_ROW + FOOT);
  const spanMs = we - ws, chartW = right - left;
  const xOf = (t) => left + (t - ws) / spanMs * chartW;
  const dateBase = chartBottom + slack;

  const svg = el("svg", { width: W, height: svgH, viewBox: `0 0 ${W} ${svgH}` });
  svg.style.minWidth = W + "px";

  // 줄무늬 (선석 단위)
  rows.forEach((r, i) => {
    if (i % 2 === 0) return;
    const k = r.term + "\u0000" + r.berth;
    svg.appendChild(el("rect", { x: left, y: y0 + rowTop.get(k) * unitH, width: chartW, height: laneCount.get(k) * unitH, fill: C.rowAlt }));
  });
  // 격자: 6/12/18시 보조선, 날짜 경계 주선
  for (let day = 0; day < WINDOW_DAYS; day++) {
    for (const h of [6, 12, 18]) {
      const x = xOf(new Date(ws.getTime() + (day * 24 + h) * 36e5));
      svg.appendChild(el("line", { x1: x, x2: x, y1: y0 - slack, y2: dateBase, stroke: C.gridMinor, "stroke-width": 1 }));
    }
  }
  for (let day = 0; day <= WINDOW_DAYS; day++) {
    const x = xOf(new Date(ws.getTime() + day * 864e5));
    svg.appendChild(el("line", { x1: x, x2: x, y1: y0 - slack, y2: dateBase, stroke: C.gridMajor, "stroke-width": 1 }));
  }
  svg.appendChild(el("line", { x1: left, x2: right, y1: dateBase, y2: dateBase, stroke: C.border, "stroke-width": 1 }));

  // 위쪽 시간 눈금 — 하루 폭이 좁으면 간격을 넓힌다
  const perDay = chartW / WINDOW_DAYS;
  const step = perDay >= 150 ? 6 : perDay >= 78 ? 12 : 24;
  for (let day = 0; day < WINDOW_DAYS; day++)
    for (let h = 0; h < 24; h += step)
      svg.appendChild(el("text", { x: xOf(new Date(ws.getTime() + (day * 24 + h) * 36e5)), y: HOUR_ROW - 4, "text-anchor": "middle", "font-size": 10.5, fill: C.muted }, pad2(h)));
  // 아래쪽 날짜 라벨 — 그 날 칸 한가운데(정오)
  for (let day = 0; day < WINDOW_DAYS; day++) {
    const d = new Date(ws.getTime() + day * 864e5);
    const isToday = d.toDateString() === now.toDateString();
    const col = d.getDay() === 6 ? C.sat : d.getDay() === 0 ? C.sun : C.text;
    svg.appendChild(el("text", { x: xOf(new Date(d.getTime() + 12 * 36e5)), y: dateBase + 22, "text-anchor": "middle",
      "font-size": isToday ? 14.5 : 13.5, "font-weight": isToday ? 700 : 500, fill: col }, fmtDay(d)));
  }

  // ---- 행 헤더: 터미널(병합) | 선석
  const groups = [];
  for (let i = 0; i < rows.length;) {
    let j = i; while (j < rows.length && rows[j].term === rows[i].term) j++;
    const k0 = rows[i].term + "\u0000" + rows[i].berth, k1 = rows[j - 1].term + "\u0000" + rows[j - 1].berth;
    groups.push({ term: rows[i].term, region: rows[i].region, y1: y0 + rowTop.get(k0) * unitH,
                  y2: y0 + (rowTop.get(k1) + laneCount.get(k1)) * unitH, empty: rows.slice(i, j).every(r => r.berth == null) });
    i = j;
  }
  if (groups.length) {
    const yTop = groups[0].y1, yBot = groups[groups.length - 1].y2;
    for (const x of [sep1, sep2]) svg.appendChild(el("line", { x1: x, x2: x, y1: yTop, y2: yBot, stroke: C.tableLine }));
    const edges = new Set(groups.flatMap(g => [g.y1, g.y2]));
    for (const y of edges) svg.appendChild(el("line", { x1: 0, x2: right, y1: y, y2: y, stroke: C.tableLine }));
    for (const g of groups)
      svg.appendChild(el("text", { x: sep1 / 2, y: (g.y1 + g.y2) / 2, "text-anchor": "middle", "dominant-baseline": "central",
        "font-size": 14, "font-weight": g.empty ? 400 : 700, fill: g.empty ? C.muted : (REGION_COLOR[g.region] || C.text) }, g.term));
    for (const r of rows) {
      const k = r.term + "\u0000" + r.berth;
      svg.appendChild(el("text", { x: (sep1 + sep2) / 2, y: y0 + (rowTop.get(k) + laneCount.get(k) / 2) * unitH, "text-anchor": "middle",
        "dominant-baseline": "central", "font-size": 13.5, fill: r.berth == null ? C.muted : C.text }, berthLabel(r.berth)));
    }
  }

  // ---- 막대
  const barH = unitH * 0.66;
  const spanW = chartW;
  const clip = el("clipPath", { id: "clip-" + key });
  clip.appendChild(el("rect", { x: left, y: 0, width: chartW, height: svgH }));
  const defs = el("defs"); defs.appendChild(clip); svg.appendChild(defs);
  const barLayer = el("g", { "clip-path": `url(#clip-${key})` }); svg.appendChild(barLayer);

  for (const d of usable) {
    const k = d.terminal + "\u0000" + d.berth;
    const yc = y0 + (rowTop.get(k) + laneOf.get(d) + 0.5) * unitH;
    const x1 = Math.max(xOf(d.eta), left), x2 = Math.min(xOf(d.etd), right);
    const w = Math.max(x2 - x1, 2);
    const color = REGION_COLOR[d.region] || C.primary;
    const live = d.eta <= now && now <= d.etd;
    const g = el("g", { class: "bar" }); g.style.cursor = "default";
    g.appendChild(el("rect", { x: x1, y: yc - barH / 2, width: w, height: barH, rx: 5, ry: 5, fill: color,
      stroke: live ? blend(color, "#000000", 0.3) : C.card, "stroke-width": live ? 2 : 1.2 }));

    const shift = 0;   // 행선지(일본/중국) 점은 2026-11-18 통계 카드와 함께 뺐다. 편성표를 다 채울 수 없어서.
    // 막대 폭에 따라 표기 수준: 넓으면 선명+항차, 좁으면 선명만, 아주 좁으면 없음
    if (w > spanW / 55) {
      const avail = w - 8 - shift * 2;
      const twoLine = w > spanW / 22 && d.voyage && barH >= 27;
      const name = fitText(d.ship_name || "", twoLine ? 13.5 : 12.5, 700, avail);
      const cx = x1 + w / 2 + shift;
      if (name) g.appendChild(el("text", { x: cx, y: twoLine ? yc - 2 : yc, "text-anchor": "middle", "dominant-baseline": twoLine ? "auto" : "central",
        "font-size": twoLine ? 13.5 : 12.5, "font-weight": 700, fill: "#fff" }, name));
      if (twoLine) {
        const vy = fitText(d.voyage, 11, 400, avail);
        if (vy) g.appendChild(el("text", { x: cx, y: yc + 13, "text-anchor": "middle", "font-size": 11, fill: "#fff", opacity: .78 }, vy));
      }
    }
    let html = `<b>${esc(d.ship_name)}</b>${d.voyage ? " (" + esc(d.voyage) + ")" : ""}\n작업예정: ${fmtDT(d.eta)} ~ ${fmtDT(d.etd)}`;
    if (d.lane) html += `\n항로: ${esc(d.lane[0])} · ${esc(d.lane[1])} · ${esc(d.lane[2])}`;
    html += `\n<span style="opacity:.7">${esc(d.terminal)} ${esc(d.berth)}선석${live ? " · 접안 중" : ""}</span>`;
    bindTip(g, html);
    barLayer.appendChild(g);
  }

  // ---- 현재 시각선 + 배지
  if (now >= ws && now <= we) {
    const x = xOf(now);
    svg.appendChild(el("line", { x1: x, x2: x, y1: y0 - slack, y2: dateBase, stroke: C.now, "stroke-width": 2.2 }));
    const label = `NOW ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const bw = textW(label, 11, 700) + 14;
    svg.appendChild(el("rect", { x: x - bw / 2, y: y0 - slack + 3, width: bw, height: 18, rx: 6, fill: C.now }));
    svg.appendChild(el("text", { x, y: y0 - slack + 12, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 11, "font-weight": 700, fill: "#fff" }, label));
  }

  // ---- 구간 밖 다음 입항
  if (picks.length) {
    const parts = picks.slice(0, 2).map(d => `${d.terminal} ${d.eta.getMonth() + 1}/${d.eta.getDate()} ${d.ship_name}`);
    if (picks.length > 2) parts.push(`외 ${picks.length - 2}곳`);
    svg.appendChild(el("text", { x: right, y: svgH - 6, "text-anchor": "end", "font-size": 12, fill: C.muted }, "구간 밖 다음 입항  ·  " + parts.join("  ·  ")));
  }

  pane.appendChild(svg);
  if (!usable.length && S.updated_at) {
    const m = document.createElement("div"); m.className = "empty-msg"; m.textContent = "이 기간에 예정된 선박이 없습니다"; pane.appendChild(m);
  }
}

// ===================== 본선작업현황 =====================
const progressColor = (p) => p < 30 ? "#fa5252" : p < 70 ? "#f5a524" : "#12b886";
function renderWork(pane) {
  pane.innerHTML = "";
  const rows = [...S.work].sort((a, b) => {
    const na = parseInt((a.berth || "").match(/\d+/) || 999), nb = parseInt((b.berth || "").match(/\d+/) || 999);
    return (a.terminal || "").localeCompare(b.terminal || "") || na - nb || (a.berth || "").localeCompare(b.berth || "");
  });
  const box = document.createElement("div"); box.className = "work";
  if (!rows.length) {
    pane.appendChild(box);
    const m = document.createElement("div"); m.className = "empty-msg"; m.textContent = S.updated_at ? "현재 작업 중인 본선이 없습니다" : "불러오는 중..."; pane.appendChild(m);
    return;
  }
  box.innerHTML = `<div class="axis"><div></div><div class="ticks">${[0, 25, 50, 75, 100].map(p => `<span style="left:${p}%">${p}%</span>`).join("")}</div><div></div></div>`;
  for (const d of rows) {
    const pct = Math.max(0, Math.min(100, +d.progress || 0));
    const planned = d.status === "접안예정";
    const color = planned ? "#9aa3b2" : progressColor(pct), inside = pct >= 18;
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<div class="lb">${esc(d.terminal)} ${esc(d.berth)}선석</div>
      <div class="track">${pct > 0 ? `<div class="fill" style="width:${pct}%;background:${color}"></div>` : ""}
        <div class="txt" style="${inside ? `left:${pct / 2}%;transform:translate(-50%,-50%);color:#fff` : `left:calc(${pct}% + 8px);color:${C.text}`}">
          <div class="n">${esc(d.ship_name)}(${esc(d.line || "")})</div>${d.voyage || d.status ? `<div class="vy" style="${inside ? "" : "color:" + C.muted}">${d.status ? esc(d.status) + " · " : ""}${esc(d.voyage || "")}</div>` : ""}</div>
      </div>
      <div class="pct" style="color:${color}">${planned ? "대기" : pct + "%"}</div>`;
    const time = d.eta && d.etd ? `\n작업예정: ${fmtDT(parseDT(d.eta))} ~ ${fmtDT(parseDT(d.etd))}` : "";
    bindTip(row, `<b>${esc(d.ship_name)}(${esc(d.line || "")})</b> · ${esc(d.voyage || "")}${time}\n진행률 ${pct}%  ·  양하 ${esc(d.discharge || "-")} / 적하 ${esc(d.load || "-")}`);
    box.appendChild(row);
  }
  pane.appendChild(box);
}

// ===================== 국내공컨현황 =====================
function renderEmpty(pane) {
  pane.innerHTML = "";
  const byKey = {};
  for (const d of S.empty) byKey[d.carrier + "|" + d.terminal] = d;
  const rows = EMPTY_TERMINALS.map(t => ["DYS", t]);
  const rowColor = {}, seen = {};
  for (const [, t] of rows) {
    const rg = TERMINAL_REGION[t] || ""; const n = seen[rg] || 0; seen[rg] = n + 1;
    rowColor[t] = blend(REGION_COLOR[rg] || C.primary, "#ffffff", Math.min(0.45, 0.34 * n));
  }
  const get = (c, t) => byKey[c + "|" + t];
  const cellTotal = (k) => rows.reduce((s, [c, t]) => s + ((get(c, t) || {}).counts || {})[k] || 0, 0);
  const totalAll = rows.reduce((s, [c, t]) => s + ((get(c, t) || {}).total || 0), 0);
  const val = (v, cls) => `<td class="${cls || ""}${v ? "" : " zero"}">${v ? fmtN(v) : "–"}</td>`;
  const gcls = (i, n) => "gc" + (i === 0 ? " gl" : "") + (i === n - 1 ? " gr" : "");   // 그룹 안 위치별 테두리

  let h = `<div class="emp"><div class="head"><h2>국내 공컨 재고</h2><span class="m">선사코드 DYS · ${rows.length}개 터미널</span>
    <span class="tot">총 재고 <b>${fmtN(totalAll)}</b> 개</span></div><table class="et"><thead><tr><th class="lb" rowspan="2">구분</th>`;
  for (const [g, cols] of EMPTY_GROUPS) h += `<th class="g" colspan="${cols.length}"><span>${g}</span></th><th class="gap" rowspan="2"></th>`;
  h += `<th rowspan="2" style="color:var(--text)">합계</th></tr><tr>`;
  for (const [, cols] of EMPTY_GROUPS) cols.forEach(([, sub], i) => { h += `<th class="${gcls(i, cols.length)}">${sub}</th>`; });
  h += `</tr></thead><tbody>`;
  for (const [c, t] of rows) {
    const d = get(c, t), counts = d ? d.counts : {};
    h += `<tr><td class="lb"><span class="dot" style="background:${rowColor[t]}"></span>${t}<span class="rg">${TERMINAL_REGION[t] || ""}</span></td>`;
    for (const [, cols] of EMPTY_GROUPS) { cols.forEach(([k], i) => { h += val(counts[k] || 0, gcls(i, cols.length)); }); h += `<td class="gap"></td>`; }
    h += val(d ? d.total : 0, "tot") + `</tr>`;
  }
  h += `</tbody><tfoot><tr><td class="lb">합계</td>`;
  for (const [, cols] of EMPTY_GROUPS) { cols.forEach(([k], i) => { h += val(cellTotal(k), gcls(i, cols.length)); }); h += `<td class="gap"></td>`; }
  h += val(totalAll, "tot") + `</tr></tfoot></table>`;
  h += `<div class="note">RF(냉동)는 광양서부만 타입별 재고를 제공합니다 · 신선대/감만의 FR은 플랫랙 · E1CT/한진신항은 GP/HQ만 제공</div>`;
  // 터미널별 비중
  h += `<div class="share"><div class="lb">터미널별 비중</div><div class="bar">`;
  for (const [c, t] of rows) { const v = (get(c, t) || {}).total || 0; if (v) h += `<i style="flex:${v};background:${rowColor[t]}"></i>`; }
  h += `</div><div class="lg">`;
  for (const [c, t] of rows) { const v = (get(c, t) || {}).total || 0; const p = totalAll ? Math.round(v / totalAll * 100) : 0;
    h += `<span><i style="background:${rowColor[t]}"></i>${t}<span class="c">${fmtN(v)}개 · ${p}%</span></span>`; }
  h += `</div></div></div>`;
  pane.innerHTML = h;
  if (!S.empty.length) { const m = document.createElement("div"); m.className = "empty-msg"; m.textContent = S.updated_at ? "" : "불러오는 중..."; pane.appendChild(m); }
}

const ktToMs = (k) => Math.round(k * 0.5144);
function tyTime(iso) {               // 자료는 UTC. 보는 PC 시각(한국이면 KST)으로
  if (!iso) return "-";
  const d = new Date(iso.endsWith("Z") ? iso : iso + "Z");

function dirKo(deg) {

  return n[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];

const fmtLat = (v) => `${Math.abs(v).toFixed(1)}°${v >= 0 ? "N" : "S"}`;
const fmtLon = (v) => `${(v > 180 ? 360 - v : v).toFixed(1)}°${v > 180 ? "W" : "E"}`;

function tyAge(s) {

// 소멸한 태풍을 지도·목록에 보여줄지. 기본은 끔, 선택은 브라우저에 기억한다.

function drawTyMap(box, storms, T) {
  box.innerHTML = "";
  const lonSpan = TY_VIEW.lon1 - TY_VIEW.lon0, latSpan = (TY_VIEW.lat1 - TY_VIEW.lat0) * TY_YSCALE;
  // 지도가 화면보다 커지면 카드가 늘어나 페이지 전체가 밀린다. 높이를 화면에 맞춰 제한하고
  // 폭은 비율대로 줄인다(남는 좌우 여백은 바다색이라 티가 안 난다).
  const availH = Math.max(380, Math.min(innerHeight - 310, 900));
  let W = Math.max(box.clientWidth || 0, 320), H = Math.round(W * latSpan / lonSpan);
  if (H > availH) { H = availH; W = Math.round(H * lonSpan / latSpan); }
  box.style.height = H + "px";
  box.parentElement && box.parentElement.style.setProperty("--mapH", H + "px");
  const k = W / lonSpan;
  const X = (lon) => (lon - TY_VIEW.lon0) * k, Y = (lat) => (TY_VIEW.lat1 - lat) * k * TY_YSCALE;
  const kmPx = (km) => km / 111 * k;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H });
  svg.appendChild(el("rect", { x: 0, y: 0, width: W, height: H, fill: "#d9e6f2" }));

  // 경위선
  const gr = el("g", { stroke: "#ffffff", "stroke-width": 1, "stroke-opacity": .7 });
  for (let lon = 100; lon <= 160; lon += 10) gr.appendChild(el("line", { x1: X(lon), x2: X(lon), y1: 0, y2: H }));
  for (let lat = 10; lat <= 50; lat += 10) gr.appendChild(el("line", { x1: 0, x2: W, y1: Y(lat), y2: Y(lat) }));
  svg.appendChild(gr);
  // 육지
  if (COAST) {
    const g = el("g", { fill: "#eef0f3", stroke: "#ffffff", "stroke-width": 1, "stroke-linejoin": "round" });
    for (const c of COAST.countries) {
      let d = "";
      for (const ring of c.r) d += ring.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join("") + "Z";
      g.appendChild(el("path", { d }));
    }
    svg.appendChild(g);
  } else {
    svg.appendChild(el("text", { x: W / 2, y: H / 2, "text-anchor": "middle", "font-size": 13, fill: C.muted }, "해안선 불러오는 중..."));
  }
  for (let lon = 100; lon <= 160; lon += 10) svg.appendChild(el("text", { x: X(lon) + 3, y: H - 6, "font-size": 10, fill: "#7d8aa0" }, `${lon}°E`));
  for (let lat = 10; lat <= 50; lat += 10) svg.appendChild(el("text", { x: 4, y: Y(lat) - 3, "font-size": 10, fill: "#7d8aa0" }, `${lat}°N`));
  // 지명
  for (const [name, lon, lat] of TY_LABELS) {
    const sea = TY_SEA.has(name);
    svg.appendChild(el("text", { x: X(lon), y: Y(lat), "text-anchor": "middle", "font-size": sea ? 10.5 : 12, "font-weight": sea ? 400 : 600,
      fill: sea ? "#7a93b3" : "#6b7280", "font-style": sea ? "italic" : "normal", "letter-spacing": sea ? ".08em" : "0" }, name));
  }
  // 항만 (한국·일본·중국·베트남·태국 주요 항)
  for (const [name, lon, lat, cc, anchor, dx, dy] of TY_PORTS) {
    const col = TY_PORT_COLOR[cc] || "#475569", kr = cc === "KR";
    svg.appendChild(el("circle", { cx: X(lon), cy: Y(lat), r: kr ? 3.4 : 2.6, fill: col, stroke: "#fff", "stroke-width": 1.2 }));
    const t = el("text", { x: X(lon) + dx, y: Y(lat) + dy, "text-anchor": anchor, "font-size": kr ? 10.5 : 9.5, "font-weight": kr ? 700 : 600,
      fill: col, stroke: "#ffffff", "stroke-width": 3, "paint-order": "stroke", "stroke-linejoin": "round" }, name);
    svg.appendChild(t);
  }

  // 태풍
  const outside = (p) => p.lon < TY_VIEW.lon0 - 5 || p.lon > TY_VIEW.lon1 + 5 || p.lat < TY_VIEW.lat0 - 5 || p.lat > TY_VIEW.lat1 + 5;
  for (const s of storms) {
    const dim = s.status !== "active";
    const g = el("g", { opacity: dim ? .6 : 1 });
    const track = (s.track || []).filter(p => p.lat != null && !outside(p));
    // 과거 경로: 구간마다 등급 색
    for (let i = 1; i < track.length; i++) {
      const a = track[i - 1], b = track[i];
      g.appendChild(el("line", { x1: X(a.lon), y1: Y(a.lat), x2: X(b.lon), y2: Y(b.lat), stroke: TY_CAT[b.cat || "TD"][1], "stroke-width": 2.4, "stroke-linecap": "round" }));
    }
    for (const p of track) {
      const hh = +(p.t || "").slice(11, 13);
      if (hh % 6) continue;                                   // 6시간 간격 점만
      const c = el("circle", { cx: X(p.lon), cy: Y(p.lat), r: 3, fill: TY_CAT[p.cat || "TD"][1], stroke: "#fff", "stroke-width": 1 });
      bindTip(c, `<b>${esc(s.name_ko || s.name)}</b> · ${TY_CAT[p.cat || "TD"][0]}\n${tyTime(p.t)}\n${fmtLat(p.lat)} ${fmtLon(p.lon)}${p.wind ? `\n최대풍속 ${p.wind}kt (${ktToMs(p.wind)}m/s)` : ""}${p.pres ? `\n중심기압 ${p.pres}hPa` : ""}`);
      g.appendChild(c);
    }
    // 예보 (JTWC)
    const fc = (s.forecast || []).filter(p => p.lat != null);
    if (s.lat != null && fc.length) {
      let prev = { lat: s.lat, lon: s.lon };
      for (const p of fc) {
        const r = kmPx(TY_FC_RADIUS_KM[p.tau] || p.tau * 4.5);
        g.appendChild(el("circle", { cx: X(p.lon), cy: Y(p.lat), r, fill: "#ef6a1f", "fill-opacity": .07, stroke: "#ef6a1f", "stroke-opacity": .5, "stroke-width": 1, "stroke-dasharray": "3 3" }));
        g.appendChild(el("line", { x1: X(prev.lon), y1: Y(prev.lat), x2: X(p.lon), y2: Y(p.lat), stroke: "#334155", "stroke-width": 1.6, "stroke-dasharray": "5 4" }));
        prev = p;
      }
      for (const p of fc) {
        const c = el("circle", { cx: X(p.lon), cy: Y(p.lat), r: 4, fill: "#fff", stroke: TY_CAT[p.cat || "TD"][1], "stroke-width": 2.2 });
        bindTip(c, `<b>${esc(s.name_ko || s.name)}</b> · ${p.tau}시간 예보 (JTWC)\n${tyTime(p.t)}\n${fmtLat(p.lat)} ${fmtLon(p.lon)}${p.wind ? `\n최대풍속 ${p.wind}kt (1분 평균, ${ktToMs(p.wind)}m/s)` : ""}`);
        g.appendChild(c);
        g.appendChild(el("text", { x: X(p.lon) + 6, y: Y(p.lat) - 5, "font-size": 10, "font-weight": 700, fill: "#334155" }, `${p.tau}h`));
      }
    }
    // 현재 위치
    if (s.lat != null && !outside(s)) {
      const col = TY_CAT[tyCatOf(s)][1];
      const cx = X(s.lon), cy = Y(s.lat);
      if (!dim) g.appendChild(el("circle", { cx, cy, r: 16, fill: col, "fill-opacity": .18 }));
      g.appendChild(el("circle", { cx, cy, r: dim ? 6 : 8, fill: col, stroke: "#fff", "stroke-width": 2 }));
      g.appendChild(el("circle", { cx, cy, r: dim ? 1.6 : 2.4, fill: "#fff" }));
      const label = (s.name_ko ? `${s.name_ko} (${s.name})` : s.name) + (dim ? " · 소멸" : "");
      const tw = textW(label, 11.5, 700) + 12;
      const lx = cx + 11 + tw > W - 6 ? cx - 11 - tw : cx + 11;      // 오른쪽이 잘리면 왼쪽에
      g.appendChild(el("rect", { x: lx, y: cy - 20, width: tw, height: 18, rx: 6, fill: "#fff", "fill-opacity": .92, stroke: col, "stroke-width": 1 }));
      g.appendChild(el("text", { x: lx + 6, y: cy - 7, "font-size": 11.5, "font-weight": 700, fill: "#1c1f26" }, label));
      const hit = el("circle", { cx, cy, r: 14, fill: "transparent" });
      bindTip(hit, tyTipHTML(s));
      g.appendChild(hit);
    }
    svg.appendChild(g);
  }
  box.appendChild(svg);

  // 범례 / 시각
  const lg = document.createElement("div"); lg.className = "legend";
  lg.innerHTML = Object.entries(TY_CAT).map(([k, [n, c]]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")
    + `<span><i class="fc"></i>예보 경로(JTWC)</span>`;
  box.appendChild(lg);
  const st = document.createElement("div"); st.className = "stamp";
  st.textContent = T.fetched_at ? `자료 ${T.fetched_at}` : "자료 없음";
  box.appendChild(st);
}

function tyTipHTML(s) {
  const cat = TY_CAT[tyCatOf(s)];
  let h = `<b>${esc(s.name_ko || s.name)}</b> ${s.name_ko ? "(" + esc(s.name) + ")" : ""} · ${cat[0]}\n${tyTime(s.updated)} 기준`;
  if (s.lat != null) h += `\n${fmtLat(s.lat)} ${fmtLon(s.lon)}`;
  if (s.wind_kt) h += `\n최대풍속 ${s.wind_kt}kt (${ktToMs(s.wind_kt)}m/s)`;
  if (s.pres_hpa) h += `\n중심기압 ${s.pres_hpa}hPa`;
  if (s.move_dir != null) h += `\n이동 ${dirKo(s.move_dir)} ${s.move_kt != null ? s.move_kt + "kt" : ""}`;
  return h;
}

function tySideHTML(T, storms, goneN) {
  const active = storms.filter(s => s.status === "active"), recent = storms.filter(s => s.status !== "active");
  let h = `<h2>태풍 모니터링 ${active.length ? `<span class="pill" style="background:${TY_CAT.TY[1]}">활동 ${active.length}</span>` : `<span class="pill ghost">활동 없음</span>`}
      <button type="button" class="ty-toggle${tyShowGone ? " on" : ""}" aria-pressed="${tyShowGone}" title="최근 10일 이내 소멸한 태풍을 지도와 목록에 표시"><i></i>소멸 조회${goneN ? ` ${goneN}` : ""}</button></h2>
    <div class="m">북서태평양 · 한국 · 일본 · 중국 · 러시아 극동 · 베트남 해역 · ${T.fetched_at ? "수집 " + T.fetched_at : "자료 없음"}</div>`;
  if (!active.length) {
    h += `<div class="ty-quiet"><div class="big">현재 활동 중인 태풍이 없습니다</div><div class="m">열대저압부·태풍이 발생하면 10분 이내에 지도와 목록에 자동 표시됩니다</div></div>`;
  }
  const card = (s, dim) => {
    const cat = TY_CAT[tyCatOf(s)];
    const no = s.jma_number ? String(s.jma_number).slice(-2).replace(/^0/, "") : "";
    return `<div class="ty-storm${dim ? " dim" : ""}">
      <div class="nm"><b>${esc(s.name_ko || s.name)}</b>${s.name_ko ? `<span class="en">${esc(s.name)}</span>` : ""}
        <span class="pill" style="background:${cat[1]}">${cat[0]}</span>
        ${dim ? `<span class="pill ghost">소멸 · ${tyAge(s)}</span>` : `<span class="pill ghost">${tyAge(s)} 갱신</span>`}
        ${no ? `<span class="pill ghost">제${no}호</span>` : ""}</div>
      <div class="kv">
        <span>위치</span><span>${s.lat != null ? `${fmtLat(s.lat)} ${fmtLon(s.lon)}` : "-"}</span>
        <span>최대풍속</span><span>${s.wind_kt ? `${s.wind_kt}kt · ${ktToMs(s.wind_kt)}m/s` : "-"}${s.jtwc_wind_kt ? ` <span class="m">(JTWC 1분 ${s.jtwc_wind_kt}kt)</span>` : ""}</span>
        <span>중심기압</span><span>${s.pres_hpa ? s.pres_hpa + " hPa" : "-"}</span>
        <span>이동</span><span>${s.move_dir != null ? `${dirKo(s.move_dir)} ${s.move_kt != null ? s.move_kt + "kt (" + ktToMs(s.move_kt) + "m/s)" : ""}` : "-"}</span>
        <span>기준시각</span><span>${tyTime(s.updated)}</span>
        <span>예보</span><span>${(s.forecast || []).length ? `${s.forecast[s.forecast.length - 1].tau}시간까지 (JTWC 경보 #${s.jtwc_warning_no || "-"})` : "없음"}</span>
        <span>자료</span><span>${(s.sources || []).join(" · ") || "-"}</span>
      </div>
      ${Object.keys(s.links || {}).length ? `<div class="links">${Object.entries(s.links).map(([n, u]) => `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}</div>` : ""}
    </div>`;
  };
  h += active.map(s => card(s, false)).join("");
  if (recent.length) h += `<div class="m" style="margin-top:4px">최근 소멸 (10일 이내)</div>` + recent.map(s => card(s, true)).join("");
  const links = T.links || {};
  h += `<div class="ty-src"><div class="lb">참고 사이트</div><div class="row">${Object.entries(links).map(([n, u]) => `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}</div>
    <div class="m" style="margin-top:8px">위치·강도: IBTrACS(NOAA, JMA·JTWC 분석 통합) · 예보: JTWC 경보문 · 발생 감시: JMA. 공식 예보·특보는 기상청을 확인하세요. 시각은 보는 PC 기준.</div></div>`;
  if (T.errors && T.errors.length) h += `<div class="ty-err">${esc(T.errors.join("\n"))}</div>`;
  return h;
}

// ===================== 렌더 진입 =====================
function renderPane() {
  for (const p of document.querySelectorAll(".pane")) p.classList.remove("on");
  const paneKey = tab === "work" ? "work" : tab === "empty" ? "empty" : tab === "typhoon" ? "typhoon" : "gantt";
  const pane = $(paneKey + "Pane"); pane.classList.add("on");
  hideTip();
  if (paneKey === "gantt") renderGantt(pane, tab);
  else if (paneKey === "work") renderWork(pane);
  else if (paneKey === "typhoon") renderTyphoon(pane);
  else renderEmpty(pane);
}
function renderAll() {
  const [ws, we] = ganttWindow();
  renderStats(S.data.filter(d => inWindow(d, ws, we)));
  renderStatus();
  renderPane();
}

// ===================== 데이터/실시간 =====================
// 정적 모드: GitHub Pages 처럼 server.py 없이 올라간 경우. build_static.py 가 만든
// ./data.json 을 읽고, SSE/수동조회는 없다(GitHub Actions 가 5분마다 새로 올림).
let STATIC = location.hostname.endsWith("github.io") || location.protocol === "file:"
          || /claude|anthropic/.test(location.hostname) || location.search.includes("static");
// ---- 비밀번호 잠금 ----
// data.json 이 암호화돼 올라온 경우({enc:1,...}) 비밀번호로 만든 키로 풀어야 내용이 보인다.
// 화면만 가리는 게 아니라 자료 자체가 암호문이라, 비밀번호 없이는 파일을 직접 받아도 읽을 수 없다.
// 한 번 맞게 입력하면 키를 이 브라우저에 기억해 다음부터는 묻지 않는다(비밀번호가 바뀌면 다시 묻는다).
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let gatePending = null, memKey = null;
async function deriveKeyB64(pw, j) {
  const te = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: te.encode(j.salt), iterations: j.iter, hash: "SHA-256" }, base, 256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
async function decryptWith(keyB64, j) {
  const key = await crypto.subtle.importKey("raw", unb64(keyB64), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(j.iv) }, key, unb64(j.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(j) {
  let saved = memKey; try { saved = saved || localStorage.getItem("dysKey"); } catch {}
  if (saved) {
    try { const d = await decryptWith(saved, j); memKey = saved; return d; }
    catch { memKey = null; try { localStorage.removeItem("dysKey"); } catch {} }     // 비밀번호가 바뀌었다
  }
  gatePending = j;
  if (!$("gate").classList.contains("on")) {
    $("gateLogo").src = document.querySelector(".hd .logo").src;
    $("gate").classList.add("on"); $("gatePw").focus();
  }
  return null;
}
$("gateForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const pw = $("gatePw").value.trim();
  if (!pw || !gatePending) return;
  $("gateBtn").disabled = true; $("gateMsg").textContent = "";
  try {
    const k = await deriveKeyB64(pw, gatePending);
    await decryptWith(k, gatePending);
    memKey = k; try { localStorage.setItem("dysKey", k); } catch {}
    $("gate").classList.remove("on"); $("gatePw").value = "";
    loadData();
  } catch {
    $("gateMsg").textContent = "비밀번호가 맞지 않습니다";
    $("gatePw").select();
  }
  $("gateBtn").disabled = false;
};

async function loadData() {
  try {
    let r = await fetch(STATIC ? "./data.json" : "/api/data", { cache: "no-store" }).catch(() => null);
    if (!STATIC && (!r || !r.ok)) {        // server.py 가 없는 호스트면 정적 파일로 넘어간다
      r = await fetch("./data.json", { cache: "no-store" });
      if (r.ok) { STATIC = true; $("live").style.display = "none"; }
    }
    let j = await r.json();
    if (j.enc) { j = await unlock(j); if (!j) return; }
    j.data = (j.data || []).map(d => ({ ...d, eta: parseDT(d.eta), etd: parseDT(d.etd) }));
    if (STATIC) { delete j.server_now; j.fetching = false; }   // 파일 생성 시각은 현재 시각이 아니다
    S = { ...S, ...j };
    renderAll();
  } catch (e) {
    $("statusText").textContent = STATIC ? "데이터 파일(data.json)을 읽을 수 없습니다"
                                         : "서버에 연결할 수 없습니다 (server.py 가 실행 중인지 확인)";
    $("status").classList.add("err");
  }
}
function connectSSE() {
  const es = new EventSource("/api/events");
  es.onopen = () => $("live").classList.add("on");
  es.onerror = () => $("live").classList.remove("on");       // EventSource 가 알아서 재접속한다
  es.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "fetching") { S.fetching = true; renderStatus(); }
    else if (m.type === "update") { S.fetching = false; loadData(); }
    else if (m.type === "hello") { S.fetching = !!m.fetching; renderStatus(); if (m.generation !== S.generation) loadData(); }
  };
}
$("refreshBtn").onclick = async () => {
  if (STATIC) {
    const before = S.generation;
    $("refreshBtn").disabled = true; $("spin").classList.add("on");
    await loadData();
    $("spin").classList.remove("on"); $("refreshBtn").disabled = false;
    const at = S.updated_at ? S.updated_at.slice(11, 16) : "-";
    const left = S.updated_at ? Math.max(0, Math.round((parseDT(S.updated_at.replace(" ", "T")).getTime() + S.refresh_sec * 1000 - Date.now()) / 60000)) : null;
    toast(S.generation !== before ? `새 자료로 갱신했습니다 (${at} 수집)`
        : `지금이 최신 자료입니다 (${at} 수집) · 다음 자동 수집 ${left == null ? "-" : left <= 0 ? "곧" : left + "분 후"}`);
    return;
  }
  try {
    const r = await fetch("/api/refresh", { method: "POST" });
    const j = await r.json();
    if (j.status === "cooldown") toast(`방금 갱신했습니다. ${j.wait}초 후 다시 시도해 주세요`);
    else if (j.status === "already") toast("이미 조회 중입니다");
    else { S.fetching = true; renderStatus(); }
  } catch { toast("서버에 연결할 수 없습니다"); }
};

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(renderPane, 200); });
// 카드 크기가 바뀌면(창 크기·줌·글꼴 로딩 등) 간트를 다시 그린다. 막대 두께와 말줄임이 픽셀 기준이라서.
let lastCardH = 0;
new ResizeObserver(() => {
  const h = $("card").clientHeight;
  if (Math.abs(h - lastCardH) < 2) return;
  lastCardH = h; clearTimeout(resizeT); resizeT = setTimeout(renderPane, 150);
}).observe($("card"));
setInterval(() => { renderNextChip(); if (tab !== "work" && tab !== "empty" && tab !== "typhoon") renderPane(); }, 60000);   // 현재 시각선 1분마다
setInterval(loadData, STATIC ? 60000 : 180000);                                                                           // SSE 가 끊겨도 3분마다 보정
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadData(); });

buildTabs();
renderStatus();
renderPane();
loadData();
if (STATIC) $("live").style.display = "none";
else if (!location.search.includes("nosse")) connectSSE();   // ?nosse=1 : 실시간 푸시 없이 폴링만
</script>
</body>
